[project]
name = "greenpick"
version = "0.1.0"
description = "Design-time sustainability co-pilot (MCP server): greener cloud-region choices with carbon + cost + latency tradeoffs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",          # Model Context Protocol SDK (FastMCP lives here)
    "pydantic>=2.0",
    "httpx>=0.27",       # async HTTP for live data sources
    # .env is parsed by config.py with no third-party dep (avoids the python-dotenv/dotenv
    # name-collision that silently skipped loading under some interpreters).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ijson>=3.0",   # used only by scripts/refresh_pricing.py (not a runtime dep)
]

[project.scripts]
greenpick = "greenpick.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
