[project]
name = "greenpick"
version = "0.4.0"
description = "Design-time sustainability co-pilot (MCP server): greener, cheaper cloud infrastructure decisions with carbon + cost + latency tradeoffs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Data Science Advisers, LLC", email = "info@datascienceadvisers.com" }]
keywords = ["mcp", "sustainability", "carbon", "cloud", "finops", "developer-tools", "green-software"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2,<2",       # Model Context Protocol SDK (FastMCP lives here). Pinned <2: mcp 2.x
                         # renamed FastMCP -> MCPServer and changed APIs; this code targets the 1.x API.
    "pydantic>=2.0",
    "httpx>=0.27",       # async HTTP for live data sources
    # .env is parsed by config.py with no third-party dep (avoids the python-dotenv/dotenv
    # name-collision that silently skipped loading under some interpreters).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ijson>=3.0",   # used only by scripts/refresh_pricing.py (not a runtime dep)
]

[project.urls]
Homepage = "https://github.com/bithug01/greenpick"
Repository = "https://github.com/bithug01/greenpick"
Issues = "https://github.com/bithug01/greenpick/issues"

[project.scripts]
greenpick = "greenpick.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the static JSON models into the wheel. Without this, a pip install from
# PyPI ships no data files and every tool fails at Path(__file__).parent / "*.json".
"greenpick.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
