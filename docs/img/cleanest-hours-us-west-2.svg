<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="40" y="42" font-size="23" font-weight="700" fill="#0f172a">When to run a deferrable job — us-west-2</text>
  <text x="40" y="69" font-size="14.5" fill="#475569">Grid carbon by hour of day, averaged over ~13 days of live EIA data. Lower is cleaner.</text>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="70" y1="360" x2="730" y2="360"/>
    <line x1="70" y1="296" x2="730" y2="296"/>
    <line x1="70" y1="232" x2="730" y2="232"/>
    <line x1="70" y1="168" x2="730" y2="168"/>
    <line x1="70" y1="104" x2="730" y2="104"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="62" y="364">0</text>
    <text x="62" y="300">40</text>
    <text x="62" y="236">80</text>
    <text x="62" y="172">120</text>
    <text x="62" y="108">160</text>
  </g>
  <text x="20" y="235" font-size="12" fill="#64748b" transform="rotate(-90 20 235)" text-anchor="middle">gCO₂ / kWh</text>

  <rect x="70" y="100" width="129" height="260" fill="#16a34a" opacity="0.10"/>
  <text x="134" y="94" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="middle">cleanest window</text>

  <rect x="558" y="100" width="57" height="260" fill="#dc2626" opacity="0.08"/>
  <text x="586" y="94" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="middle">peak</text>

  <polyline fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linejoin="round" points="
    70,243 98.7,254 127.4,256 156.1,248 184.8,233 213.5,214 242.2,196 270.9,181 299.6,172 328.3,168 357,168 385.7,168 414.4,167 443.1,162 471.8,152 500.5,141 529.2,129 557.9,121 586.6,120 615.3,128 644,144 672.7,168 701.4,194 730,222"/>

  <circle cx="127.4" cy="256" r="5" fill="#16a34a"/>
  <text x="127.4" y="282" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">02:00 · 64 g</text>
  <circle cx="586.6" cy="120" r="5" fill="#dc2626"/>
  <text x="586.6" y="112" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">18:00 · 148 g</text>

  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="70" y="378">00</text>
    <text x="242" y="378">06</text>
    <text x="414" y="378">12</text>
    <text x="586" y="378">18</text>
    <text x="730" y="378">23h</text>
  </g>

  <text x="40" y="414" font-size="15" fill="#0f172a">Run it at <tspan font-weight="700" fill="#16a34a">~02:00</tspan> instead of the evening peak and cut this region's grid carbon by <tspan font-weight="700">~57%</tspan> — same work, same region, just a cleaner hour.</text>
  <text x="40" y="438" font-size="12" fill="#94a3b8">GreenPick · directional, from recent live grid history. For deferrable work: batch, ETL, backups, training.</text>
</svg>
