<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" font-family="system-ui, sans-serif">
  <rect width="300" height="300" fill="none"/>

  <g transform="translate(150,150) rotate(38) translate(-70,-120)">

    <!-- stem: light green, thin, recedes -->
    <path d="M70 226 C76 216 74 206 62 196" stroke="#86efac" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- classic ovate leaf -->
    <path d="M70 18
             C118 54 140 112 110 176
             C100 198 84 210 70 214
             C56 210 40 198 30 176
             C0 112 22 54 70 18 Z"
          fill="#16a34a"/>

    <!-- midrib: single clean arc, base -> tip -->
    <path d="M68 206 C58 150 66 78 74 30" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- branch traces: angular / circuit-like -->
    <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M61 168 L40 168 L32 158"/>
      <path d="M62 150 L82 150 L92 140"/>
      <path d="M66 120 L92 120 L100 112 L100 102"/>
      <path d="M64 110 L48 110 L40 102"/>
      <path d="M69 84 L88 84 L94 78"/>
      <path d="M68 72 L52 72 L46 64 L46 56"/>
      <path d="M73 54 L89 54"/>
      <path d="M61 142 L53 134"/>
      <path d="M67 100 L73 94"/>
      <path d="M63 188 L80 188 L86 182"/>
    </g>

    <!-- hollow via pads (no base pad: midrib flows into the stem) -->
    <g fill="#16a34a" stroke="#ffffff" stroke-width="2.4">
      <circle cx="74" cy="30" r="4.6"/>
      <circle cx="32" cy="158" r="3.6"/>
      <circle cx="92" cy="140" r="3.6"/>
      <circle cx="100" cy="102" r="3.6"/>
      <circle cx="40" cy="102" r="3.2"/>
      <circle cx="94" cy="78" r="3.2"/>
      <circle cx="46" cy="56" r="3.6"/>
      <circle cx="89" cy="54" r="3.2"/>
      <circle cx="53" cy="134" r="2.9"/>
      <circle cx="73" cy="94" r="2.9"/>
      <circle cx="86" cy="182" r="3.2"/>
    </g>
  </g>
</svg>
