<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" font-family="system-ui, sans-serif">
  <rect width="120" height="120" fill="none"/>

  <!-- simplified mark for small sizes (favicon): classic leaf, few bold traces, large hollow pads -->
  <g transform="translate(60,60) rotate(38) translate(-60,-62)">

    <!-- small angled stem -->
    <path d="M60 110 C64 104 63 98 55 92" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- classic ovate leaf (scaled) -->
    <path d="M60 10
             C100 38 118 86 92 136
             C84 154 70 164 60 167
             C50 164 36 154 28 136
             C2 86 20 38 60 10 Z"
          transform="scale(0.78) translate(17,2)"
          fill="#16a34a"/>

    <!-- few bold traces (readable tiny) -->
    <g stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 104 L58 60 L66 50 L66 30"/>
      <path d="M58 82 L40 82 L34 74"/>
      <path d="M58 68 L76 68 L82 60"/>
      <path d="M66 46 L50 46"/>
    </g>

    <!-- large hollow pads -->
    <g fill="#16a34a" stroke="#ffffff" stroke-width="3.4">
      <circle cx="66" cy="30" r="6"/>
      <circle cx="58" cy="104" r="6"/>
      <circle cx="34" cy="74" r="5"/>
      <circle cx="82" cy="60" r="5"/>
      <circle cx="50" cy="46" r="4.6"/>
    </g>
  </g>
</svg>
